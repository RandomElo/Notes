appId: fr.eloi.notes
productName: Notes
directories:
  output: release
  buildResources: build
# Tout le code est compilé par electron-vite dans out/ : rien d'autre n'entre dans l'archive.
files:
  - out/**
  - package.json
# Le client SMB est livré avec l'application (aucune dépendance au système).
extraResources:
  - from: resources/bin/smb-companion
    to: bin/smb-companion
  # Détourage des icônes : modèle et moteur ONNX en WebAssembly, préparés par scripts/prepare-models.sh.
  - from: resources/background-removal
    to: background-removal
  # Transcription des mémos vocaux : serveur whisper.cpp (Vulkan, toutes variantes de processeur), compilé par scripts/build-whisper.sh.
  - from: resources/whisper
    to: whisper
  # Décodeur des mémos que Chromium ne lit pas (AMR, WMA, AIFF…) : ffmpeg réduit à l'audio, compilé par scripts/build-ffmpeg.sh.
  - from: resources/ffmpeg
    to: ffmpeg
  # Icône de la fenêtre (barre des tâches) ; la même, en toutes tailles, sert à l'AppImage.
  - from: resources/icon
    to: icon
linux:
  executableName: notes
  # Une image par taille (16x16.png à 1024x1024.png), détourées de l'icône dessinée pour Notes.
  icon: resources/icon
  target:
    - target: AppImage
      arch: x64
  category: Office
  # Nom fixe : l'installation (npm run installer) remplace toujours le même fichier. La version se lit dans la barre de titre.
  artifactName: Notes.${ext}
npmRebuild: false
publish: null
